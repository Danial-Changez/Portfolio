name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint TypeScript
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Validate HTML
        run: npm run lint:html

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: No plain email address in the build
        run: |
          ! grep -rIiE '[[:alnum:]._+-]+(@|&#0*64;|&#[xX]0*40;|&commat;|%40)[[:alnum:]-]+\.[[:alpha:]]{2,}' dist

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
